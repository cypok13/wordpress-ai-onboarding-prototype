<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-label="A calm studio scene">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1ea"/>
      <stop offset="1" stop-color="#dfe4d8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7ddd0"/>
      <stop offset="1" stop-color="#d8ccbb"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.26" r="0.5">
      <stop offset="0" stop-color="#f6efe2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f6efe2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="760" fill="url(#sky)"/>
  <rect y="470" width="640" height="290" fill="url(#floor)"/>
  <circle cx="460" cy="200" r="230" fill="url(#sun)"/>
  <!-- window frames -->
  <g stroke="#c9cfc0" stroke-width="3" opacity="0.7">
    <line x1="120" y1="60" x2="120" y2="470"/>
    <line x1="300" y1="60" x2="300" y2="470"/>
    <line x1="480" y1="60" x2="480" y2="470"/>
  </g>
  <!-- plant -->
  <g fill="#9caa86">
    <path d="M70 470c0-70 10-150 26-150s10 90 4 150z"/>
    <path d="M96 340c30-24 66-24 84-6-24 8-48 22-70 44z" opacity="0.85"/>
    <path d="M96 380c-28-16-58-12-74 8 26 4 50 14 70 34z" opacity="0.85"/>
  </g>
  <rect x="66" y="470" width="60" height="42" rx="4" fill="#b79e82"/>
  <!-- seated meditating figure -->
  <g fill="#5f6b57">
    <ellipse cx="360" cy="512" rx="120" ry="18" fill="#000" opacity="0.06"/>
    <circle cx="360" cy="352" r="34"/>
    <path d="M360 384c58 0 92 46 92 96 0 22-8 34-24 34H292c-16 0-24-12-24-34 0-50 34-96 92-96z"/>
    <path d="M270 470c-26 6-44 22-52 44 22-4 44-4 66 2z"/>
    <path d="M450 470c26 6 44 22 52 44-22-4-44-4-66 2z"/>
  </g>
</svg>
